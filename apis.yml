name: Crave Retail
description: 'Crave Retail, Inc. builds in-store retail technology that connects shoppers,
  store associates, and product data across physical touchpoints. Its platform spans Crave Engage
  (customer-facing digital shopping assistants in fitting rooms, on the sales floor, and on mobile),
  Crave Assist (store-associate tools for floor visibility, service routing, and item lookup), and
  Smart Fitting Rooms, the RFID-based connected fitting-room product it started with. Crave reports
  3,000+ live touchpoints, 27M+ shopper sessions, and operations across 10+ countries. The company is
  Techstars-backed. As of this enrichment pass it publishes a marketing and legal web presence but no
  public developer API, OpenAPI specification, SDKs, or documentation.'
